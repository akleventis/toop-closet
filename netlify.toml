[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # public/ isn't on the function filesystem; bundle it so functions can read its files.
  included_files = ["public/**"]

[functions."withoutbg"]
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888
